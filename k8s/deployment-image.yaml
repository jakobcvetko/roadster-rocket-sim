# Alternative: run the Dockerfile image (push it to a registry the cluster can pull from first,
# e.g. ghcr.io/jakobcvetko/roadster-rocket-sim:latest — needs a token with write:packages).
apiVersion: apps/v1
kind: Deployment
metadata: { name: roadster-rocket, namespace: roadster-rocket, labels: { app: roadster-rocket } }
spec:
  replicas: 1
  selector: { matchLabels: { app: roadster-rocket } }
  template:
    metadata: { labels: { app: roadster-rocket } }
    spec:
      containers:
        - name: web
          image: ghcr.io/jakobcvetko/roadster-rocket-sim:latest
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
