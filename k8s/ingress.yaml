# Set the host to match the cluster's existing ingress pattern and the issuer to the cluster's ClusterIssuer
# (could not be inspected: see README "Deployment status").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roadster-rocket
  namespace: roadster-rocket
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: roadster.CHANGE-ME.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: roadster-rocket, port: { number: 80 } } }
  tls:
    - hosts: [roadster.CHANGE-ME.example]
      secretName: roadster-rocket-tls
